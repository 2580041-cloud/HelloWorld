<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アウアウ - 3D足計測・サイズ試算</title>
  <!-- Three.js (3D表示用ライブラリ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-aqua: #EBF4F6;
      --card-green: #E8F5E9;
      --border-green: #C8E6C9;
      --btn-yellow: #FFE066;
      --btn-yellow-hover: #F7D038;
      --accent-teal: #4A9E97;
      --dark-text: #2C3E50;
      --light-text: #607D8B;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--dark-text);
      background-color: var(--bg-aqua);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--white);
      padding: 14px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: var(--accent-teal);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-teal);
      text-decoration: none;
    }

    .main-container {
      max-width: 900px;
      width: 100%;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
    }

    .card {
      background-color: var(--white);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: var(--dark-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 1. 属性選択タブ (子供・女性・男性) */
    .target-selector {
      display: flex;
      background-color: var(--bg-aqua);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .target-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--light-text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .target-btn.active {
      background-color: var(--white);
      color: var(--accent-teal);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* 2. カメラ・計測体験エリア */
    .camera-preview {
      width: 100%;
      height: 260px;
      background-color: #222;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .guide-overlay {
      position: absolute;
      border: 2px dashed var(--btn-yellow);
      border-radius: 50px / 100px;
      width: 140px;
      height: 220px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    .scan-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background-color: var(--btn-yellow);
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--dark-text);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 224, 102, 0.4);
      transition: all 0.2s;
    }

    .scan-btn:hover {
      background-color: var(--btn-yellow-hover);
    }

    /* 3. 計測結果表示エリア */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-box {
      background-color: var(--card-green);
      border: 1px solid var(--border-green);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--light-text);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--dark-text);
    }

    .metric-unit {
      font-size: 0.8rem;
      font-weight: normal;
    }

    /* 4. 3Dキャンバスエリア */
    #canvas3d {
      width: 100%;
      height: 220px;
      background-color: #F8FAFC;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
    }

    .hint-text {
      font-size: 0.75rem;
      color: var(--light-text);
      text-align: center;
      margin-top: 6px;
    }

    footer {
      border-top: 1px solid rgba(0,0,0,0.05);
      padding: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--light-text);
      background-color: var(--white);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <a href="index.html" class="back-btn">‹ ホーム</a>
    <a href="index.html" class="logo">👟 アウアウ</a>
    <div style="width: 50px;"></div>
  </header>

  <div class="main-container">
    
    <!-- 左側：属性選択 ＆ 計測設定 -->
    <div class="card">
      <div class="card-title">1. 対象者と計測</div>
      
      <!-- 子供 / 女性 / 男性 切り替えタブ -->
      <div class="target-selector">
        <button class="target-btn active" onclick="selectTarget('child')">👶 子供</button>
        <button class="target-btn" onclick="selectTarget('women')">👩 女性</button>
        <button class="target-btn" onclick="selectTarget('men')">👨 男性</button>
      </div>

      <!-- カメラガイド -->
      <div class="camera-preview">
        <div class="guide-overlay"></div>
        <p style="color: #FFF; font-size: 0.85rem; z-index: 1;">足型枠に合わせて撮影</p>
      </div>

      <button class="scan-btn" onclick="runScan()">足をスキャンして計測する</button>
    </div>

    <!-- 右側：計測結果 (足長・足幅・3D形状) -->
    <div class="card">
      <div class="card-title">2. 計測結果 & 3D形状</div>

      <!-- 数値結果 (足長・足幅) -->
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">足長 (Foot Length)</div>
          <div class="metric-value" id="val-length">18.5 <span class="metric-unit">cm</span></div>
        </div>
        <div class="metric-box">
          <div class="metric-label">足幅 (Foot Width)</div>
          <div class="metric-value" id="val-width">7.4 <span class="metric-unit">cm</span></div>
        </div>
      </div>

      <!-- 3D表示エリア -->
      <div id="canvas3d"></div>
      <div class="hint-text">💡 画面をドラッグして3D足を回転できます</div>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 アウアウ. All rights reserved.</p>
  </footer>

  <script>
    // --- グローバル変数 ---
    let currentTarget = 'child';
    let scene, camera, renderer, footMesh;

    // カテゴリごとのデフォルトデータ設定
    const targetData = {
      child: { length: 18.5, width: 7.4, scaleX: 0.7, scaleZ: 0.75, color: 0xFFB7B2 },
      women: { length: 23.5, width: 9.2, scaleX: 0.9, scaleZ: 0.95, color: 0xE2F0CB },
      men:   { length: 26.5, width: 10.4, scaleX: 1.1, scaleZ: 1.15, color: 0x55C2C3 }
    };

    // --- 1. タブ切り替え処理 ---
    function selectTarget(target) {
      currentTarget = target;
      
      // ボタンの見た目更新
      document.querySelectorAll('.target-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // 数値表示の更新
      updateMetrics();
      // 3Dモデル形状の更新
      update3DFoot();
    }

    function updateMetrics() {
      const data = targetData[currentTarget];
      document.getElementById('val-length').innerHTML = `${data.length} <span class="metric-unit">cm</span>`;
      document.getElementById('val-width').innerHTML = `${data.width} <span class="metric-unit">cm</span>`;
    }

    // --- 2. スキャン擬似実行 ---
    function runScan() {
      // わずかにランダム変動を加える（体験向上）
      const base = targetData[currentTarget];
      const randomOffsetL = (Math.random() * 0.4 - 0.2).toFixed(1);
      const randomOffsetW = (Math.random() * 0.2 - 0.1).toFixed(1);

      const newLength = (parseFloat(base.length) + parseFloat(randomOffsetL)).toFixed(1);
      const newWidth = (parseFloat(base.width) + parseFloat(randomOffsetW)).toFixed(1);

      document.getElementById('val-length').innerHTML = `${newLength} <span class="metric-unit">cm</span>`;
      document.getElementById('val-width').innerHTML = `${newWidth} <span class="metric-unit">cm</span>`;

      // 3Dモデルを回転させる演出
      if (footMesh) {
        footMesh.rotation.y += Math.PI * 2;
      }
    }

    // --- 3. Three.js による 3D足形状レンダリング ---
    function init3D() {
      const container = document.getElementById('canvas3d');
      const width = container.clientWidth;
      const height = container.clientHeight;

      // シーン作成
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf8fafc);

      // カメラ設定
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 15, 20);
      camera.lookAt(0, 0, 0);

      // ライト設定
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // 簡易的な「足型」3Dメッシュ構造の作成（カプセル＋球体の統合体）
      const group = new THREE.Group();
      
      // かかと〜甲部分
      const heelGeo = new THREE.SphereGeometry(3, 32, 16);
      const mat = new THREE.MeshStandardMaterial({ 
        color: targetData.child.color, 
        roughness: 0.4,
        wireframe: false 
      });
      const heel = new THREE.Mesh(heelGeo, mat);
      heel.position.set(0, 0, 3);
      heel.scale.set(1, 0.6, 1.3);
      group.add(heel);

      // つま先部分
      const toeGeo = new THREE.SphereGeometry(2.8, 32, 16);
      const toe = new THREE.Mesh(toeGeo, mat);
      toe.position.set(0, 0, -3);
      toe.scale.set(1.1, 0.5, 1.1);
      group.add(toe);

      footMesh = group;
      scene.add(footMesh);

      // レンダラー設定
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      container.appendChild(renderer.domElement);

      // アニメーションループ
      function animate() {
        requestAnimationFrame(animate);
        if (footMesh) {
          footMesh.rotation.y += 0.005; // ゆっくり自動回転
        }
        renderer.render(scene, camera);
      }
      animate();

      update3DFoot();
    }

    // 属性変更時に3Dモデルのサイズ（スケーリング）変更
    function update3DFoot() {
      if (!footMesh) return;
      const data = targetData[currentTarget];
      
      // スケール変更
      footMesh.scale.set(data.scaleX, 1, data.scaleZ);
      
      // 色の切り替え
      footMesh.children.forEach(child => {
        child.material.color.setHex(data.color);
      });
    }

    // 初期化実行
    window.onload = () => {
      init3D();
    };
  </script>
</body>
</html>
