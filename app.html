<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アウアウ - 足サイズ計測・試算</title>
  <style>
    :root {
      --bg-aqua: #EBF4F6;
      --card-green: #E8F5E9;
      --border-green: #C8E6C9;
      --btn-yellow: #FFE066;
      --btn-yellow-hover: #F7D038;
      --accent-teal: #4A9E97;
      --dark-text: #2C3E50;
      --light-text: #607D8B;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--dark-text);
      background-color: var(--bg-aqua);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--white);
      padding: 14px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: var(--accent-teal);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-teal);
      text-decoration: none;
    }

    .main-container {
      max-width: 900px;
      width: 100%;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
    }

    .card {
      background-color: var(--white);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: var(--dark-text);
    }

    /* 1. 属性選択タブ (子供・女性・男性) */
    .target-selector {
      display: flex;
      background-color: var(--bg-aqua);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .target-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--light-text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .target-btn.active {
      background-color: var(--white);
      color: var(--accent-teal);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* 2. カメラガイドエリア */
    .camera-preview {
      width: 100%;
      height: 240px;
      background-color: #222;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .guide-overlay {
      position: absolute;
      border: 2px dashed var(--btn-yellow);
      border-radius: 50px / 100px;
      width: 130px;
      height: 200px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    .scan-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background-color: var(--btn-yellow);
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--dark-text);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 224, 102, 0.4);
      transition: all 0.2s;
    }

    .scan-btn:hover {
      background-color: var(--btn-yellow-hover);
    }

    /* 3. 計測数値結果表示 */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-box {
      background-color: var(--card-green);
      border: 1px solid var(--border-green);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--light-text);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--dark-text);
    }

    .metric-unit {
      font-size: 0.8rem;
      font-weight: normal;
    }

    /* 4. 2Dビジュアル足型表示エリア (軽量) */
    .foot-visual-area {
      width: 100%;
      height: 220px;
      background-color: #F8FAFC;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .foot-icon {
      font-size: 5rem;
      transition: transform 0.3s ease;
    }

    .foot-type-badge {
      margin-top: 8px;
      display: inline-block;
      padding: 4px 12px;
      background-color: var(--accent-teal);
      color: var(--white);
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    footer {
      border-top: 1px solid rgba(0,0,0,0.05);
      padding: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--light-text);
      background-color: var(--white);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <a href="index.html" class="back-btn">‹ ホーム</a>
    <a href="index.html" class="logo">👟 アウアウ</a>
    <div style="width: 50px;"></div>
  </header>

  <div class="main-container">
    
    <!-- 左側：対象切り替え ＆ スキャン機能 -->
    <div class="card">
      <div class="card-title">1. 対象者と計測</div>
      
      <!-- 子供 / 女性 / 男性 切り替えタブ -->
      <div class="target-selector">
        <button class="target-btn active" onclick="selectTarget('child', this)">👶 子供</button>
        <button class="target-btn" onclick="selectTarget('women', this)">👩 女性</button>
        <button class="target-btn" onclick="selectTarget('men', this)">👨 男性</button>
      </div>

      <!-- カメラ撮影エリア -->
      <div class="camera-preview">
        <div class="guide-overlay"></div>
        <p style="color: #FFF; font-size: 0.85rem; z-index: 1;">足型枠に合わせて撮影</p>
      </div>

      <button class="scan-btn" onclick="runScan()">足をスキャンして計測する</button>
    </div>

    <!-- 右側：結果表示（足長・足幅・2Dビジュアル） -->
    <div class="card">
      <div class="card-title">2. 計測結果</div>

      <!-- 足長 & 足幅 -->
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">足長 (Foot Length)</div>
          <div class="metric-value" id="val-length">18.5 <span class="metric-unit">cm</span></div>
        </div>
        <div class="metric-box">
          <div class="metric-label">足幅 (Foot Width)</div>
          <div class="metric-value" id="val-width">7.4 <span class="metric-unit">cm</span></div>
        </div>
      </div>

      <!-- 2D足型カード -->
      <div class="foot-visual-area">
        <div class="foot-icon" id="footIcon">🦶</div>
        <div class="foot-type-badge" id="footTypeBadge">標準タイプ (E相当)</div>
      </div>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 アウアウ. All rights reserved.</p>
  </footer>

  <script>
    let currentTarget = 'child';

    // ターゲットごとの基準値データ
    const targetData = {
      child: { length: 18.5, width: 7.4, scale: 0.85, type: "標準タイプ (E相当)" },
      women: { length: 23.5, width: 9.2, scale: 1.0,  type: "やや幅広 (2E相当)" },
      men:   { length: 26.5, width: 10.4, scale: 1.15, type: "幅広タイプ (3E相当)" }
    };

    // 属性（子供・女性・男性）切り替え
    function selectTarget(target, btnElement) {
      currentTarget = target;
      
      document.querySelectorAll('.target-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      updateDisplay();
    }

    // 表示データの更新
    function updateDisplay() {
      const data = targetData[currentTarget];
      document.getElementById('val-length').innerHTML = `${data.length} <span class="metric-unit">cm</span>`;
      document.getElementById('val-width').innerHTML = `${data.width} <span class="metric-unit">cm</span>`;
      document.getElementById('footTypeBadge').innerText = data.type;
      
      // アイコンサイズの連動調整
      document.getElementById('footIcon').style.transform = `scale(${data.scale})`;
    }

    // スキャン擬似実行
    function runScan() {
      const base = targetData[currentTarget];
      const randomOffsetL = (Math.random() * 0.4 - 0.2).toFixed(1);
      const randomOffsetW = (Math.random() * 0.2 - 0.1).toFixed(1);

      const newLength = (parseFloat(base.length) + parseFloat(randomOffsetL)).toFixed(1);
      const newWidth = (parseFloat(base.width) + parseFloat(randomOffsetW)).toFixed(1);

      document.getElementById('val-length').innerHTML = `${newLength} <span class="metric-unit">cm</span>`;
      document.getElementById('val-width').innerHTML = `${newWidth} <span class="metric-unit">cm</span>`;
    }
  </script>
</body>
</html>
